services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: meilisearch-vn
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_KEY:-vn-geocode-key-2026}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - meili-data:/meili_data

  geoproxy:
    image: osm-geoproxy:1.0
    container_name: geoproxy
    restart: unless-stopped
    ports:
      - "8083:3000"
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_KEY=${MEILI_KEY:-vn-geocode-key-2026}
    volumes:
      - ./smart-proxy.js:/app/smart-proxy.js:ro
    depends_on:
      - meilisearch

volumes:
  meili-data:
